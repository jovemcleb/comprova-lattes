services:
  postgres:
    image: postgres:16-alpine
    container_name: comprova_lattes_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comprova_lattes}
      POSTGRES_USER: ${POSTGRES_USER:-comprova_lattes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comprova_lattes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-comprova_lattes} -d $${POSTGRES_DB:-comprova_lattes}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: comprova_lattes_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comprova_lattes_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-comprova_lattes}:${POSTGRES_PASSWORD:-comprova_lattes}@postgres:5432/${POSTGRES_DB:-comprova_lattes}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn comprova_lattes.api.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comprova_lattes_worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-comprova_lattes}:${POSTGRES_PASSWORD:-comprova_lattes}@postgres:5432/${POSTGRES_DB:-comprova_lattes}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A comprova_lattes.worker:celery_app worker --loglevel=info

volumes:
  postgres_data:
  redis_data:
